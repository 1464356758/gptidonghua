name: Android Matcher Build
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'portable/**'
      - 'extension/core/**'
      - 'extension/assets/auto-protocol.md'
      - 'tools/build_android*.py'
      - 'tools/build_portable.py'
      - 'tools/publish_build_evidence.py'
      - '.github/workflows/android-build.yml'
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: npm test
      - run: node tools/generator-regression.mjs
      - run: python3 tools/build_android.py
      - run: python3 tools/build_android_test.py
      - name: Prepare document font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-wqy-zenhei
          python3 -m pip install fonttools==4.60.1
          cp docs/06_整合系统说明书与操作教程.md build/android/font-text.txt
          printf '\n小说自动接力系统 整合说明书 操作教程 安卓匹配生成器 使用指南 页 0123456789 ABCDEFGHIJKLMNOPQRSTUVWXYZ abcdefghijklmnopqrstuvwxyz /·｜—-（）()：:，,。.!?→' >> build/android/font-text.txt
          pyftsubset /usr/share/fonts/truetype/wqy/wqy-zenhei.ttc --font-number=0 --text-file=build/android/font-text.txt --output-file=build/android/manual-font.ttf
          cp /usr/share/doc/fonts-wqy-zenhei/copyright build/android/font-license.txt
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb shell settings put secure show_ime_with_hard_keyboard 0
            adb install build/android/ci-app.apk
            adb install build/android/ci-test.apk
            adb shell am instrument -w cn.novelrelay.matcher.test/cn.novelrelay.matcher.Checks > build/android/instrumentation.log
            cat build/android/instrumentation.log
            mkdir -p build/android-evidence
            adb pull /sdcard/Android/data/cn.novelrelay.matcher/files/. build/android-evidence/
            adb pull /sdcard/Download/book01_小说匹配文件_AUTO_RC2.zip build/android-evidence/android-saved-download.zip
            grep 'Android integration checks passed: 13' build/android/instrumentation.log
      - name: Publish unsigned output and evidence
        if: always()
        run: python3 tools/publish_build_evidence.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-unsigned-and-evidence
          path: |
            build/android/unsigned.apk
            build/android/apksigner.jar
            build/android/instrumentation.log
            build/android/manual-font.ttf
            build/android-evidence/
