name: Relay Source CI
on:
  push:
    paths:
      - 'extension/**'
      - 'tests/**'
      - 'tools/**'
      - 'docs/**'
      - 'package.json'
      - '.github/workflows/relay-ci.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core-and-generator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm test
      - run: node tools/generator-regression.mjs
      - run: python3 tools/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: novel-relay-rc2-source
          path: dist/
  browser-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.55.1
      - run: npx playwright install --with-deps chromium
      - run: python3 tools/build_portable.py
      - run: node tests/browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-fixture-evidence
          path: test-results/
